[project]
name = "rt"
requires-python = "==3.12"
version = "0.1.0"
dependencies = [
    "polars",
]

[project.optional-dependencies]
sql = [
    "psycopg2-binary",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
rt = { path = ".", editable = true }
sentence_transformers = "*"
torch = "==2.6.0"
wandb = "*"
einops = "*"
strictfire = "*"
maturin = { version = "*", "env-markers" = "sys_platform != 'linux'" }
maturin-import-hook = "*"
ml_dtypes = "*"
orjson = "*"
ipykernel = "*"
scikit-learn = "<1.6.0"
polars = "*"
matplotlib = "*"
relbench = "*"
google-cloud-bigquery = "*"
psycopg2-binary = "*"

[tool.pixi.dependencies]
rust = "*"
pygraphviz = "*"
uv = "*"

[tool.pixi.tasks]
pre = { cmd = "python -m pyrustler.pre", description = "Preprocess a relbench dataset. Usage: pixi run pre rel-f1" }
fly = { cmd = "python -m pyrustler.fly", description = "Benchmark the sampler. Usage: pixi run fly rel-f1" }
convert = { cmd = "python -m pyrustler.convert_file", description = "Convert pickle files to JSON. Usage: pixi run convert ~/scratch/pre/rel-f1" }
sqlpre = { cmd = "python -m pysqlrustler.pre", description = "Preprocess Postgres tables. Usage: pixi run sqlpre --dsn postgresql://... --config schema.json" }

